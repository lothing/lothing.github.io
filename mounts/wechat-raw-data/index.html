<!DOCTYPE html>
<html class="staticrypt-html">
    <head>
        <meta charset="utf-8" />
        <title>/*[|template_title|]*/ – 落星部落</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta http-equiv="cache-control" content="max-age=0" />
        <meta http-equiv="cache-control" content="no-cache" />
        <meta http-equiv="expires" content="0" />
        <meta http-equiv="expires" content="Tue, 01 Jan 1980 1:00:00 GMT" />
        <meta http-equiv="pragma" content="no-cache" />

        <style>
            :root {
                /* TokyoNight defaults */
                --bg: #1a1b26;
                --surface: #24283b;
                --text: #c0caf5;
                --text-secondary: #a9b1d6;
                --accent: #7aa2f7;
                --accent-hover: #89b4fa;
                --border: rgba(169, 177, 214, 0.15);
                --input-bg: #1f2335;
                --font: "JetBrains Mono", "Menlo", "Monaco", "Courier New", monospace;
            }

            /* Terminal Dark overrides */
            html[data-wiki-theme="terminal-dark"] {
                --bg: #1e1e1e;
                --surface: #2d2d30;
                --text: #d4d4d4;
                --text-secondary: #9d9d9d;
                --accent: #4ec9b0;
                --accent-hover: #6ed9c4;
                --border: rgba(212, 212, 212, 0.1);
                --input-bg: #252526;
                --font: "Menlo", "Monaco", "Courier New", monospace;
            }

            * { margin: 0; padding: 0; box-sizing: border-box; }

            body {
                background: var(--bg);
                font-family: var(--font);
                color: var(--text);
                display: flex;
                align-items: center;
                justify-content: center;
                min-height: 100vh;
            }

            .staticrypt-page {
                width: 380px;
                max-width: 90vw;
            }

            .staticrypt-form {
                background: var(--surface);
                border-radius: 12px;
                padding: 40px 32px;
                text-align: center;
                border: 1px solid var(--border);
            }

            .staticrypt-form h1 {
                font-size: 1.3em;
                font-weight: 600;
                margin-bottom: 6px;
                color: var(--accent);
            }

            .staticrypt-form .staticrypt-instructions {
                font-size: 0.85em;
                color: var(--text-secondary);
                margin-bottom: 24px;
                line-height: 1.5;
            }

            .staticrypt-password-container {
                position: relative;
                background: var(--input-bg);
                border: 1px solid var(--border);
                border-radius: 8px;
                margin-bottom: 16px;
                overflow: hidden;
            }

            .staticrypt-form input[type="password"],
            .staticrypt-form input[type="text"] {
                background: transparent;
                border: 0;
                color: var(--text);
                font-family: var(--font);
                font-size: 14px;
                outline: 0;
                padding: 14px 40px 14px 16px;
                width: 100%;
            }

            .staticrypt-form input::placeholder {
                color: var(--text-secondary);
                opacity: 0.6;
            }

            .staticrypt-toggle-password-visibility {
                cursor: pointer;
                height: 20px;
                opacity: 0.5;
                padding: 12px;
                position: absolute;
                right: 4px;
                top: 50%;
                transform: translateY(-50%);
                width: 20px;
            }
            .staticrypt-toggle-password-visibility:hover { opacity: 0.8; }

            .staticrypt-form .staticrypt-decrypt-button {
                font-family: var(--font);
                font-size: 14px;
                font-weight: 600;
                text-transform: uppercase;
                letter-spacing: 0.5px;
                outline: 0;
                background: var(--accent);
                color: var(--bg);
                width: 100%;
                border: 0;
                border-radius: 8px;
                padding: 14px;
                cursor: pointer;
                transition: background 0.2s, transform 0.1s;
            }
            .staticrypt-form .staticrypt-decrypt-button:hover {
                background: var(--accent-hover);
            }
            .staticrypt-form .staticrypt-decrypt-button:active {
                transform: scale(0.98);
            }

            .staticrypt-remember {
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 8px;
                margin-top: 16px;
                font-size: 0.8em;
                color: var(--text-secondary);
            }
            .staticrypt-remember input[type="checkbox"] {
                accent-color: var(--accent);
            }

            .staticrypt-error {
                color: #f7768e;
                font-size: 0.82em;
                margin-top: 12px;
                min-height: 1.2em;
            }

            .staticrypt-spinner {
                display: inline-block;
                width: 16px;
                height: 16px;
                border: 2px solid transparent;
                border-top: 2px solid var(--bg);
                border-radius: 50%;
                animation: spin 0.6s linear infinite;
                margin-right: 6px;
                vertical-align: middle;
            }
            @keyframes spin { to { transform: rotate(360deg); } }

            .staticrypt-footer {
                text-align: center;
                margin-top: 20px;
                font-size: 0.72em;
                color: var(--text-secondary);
                opacity: 0.5;
            }
            .staticrypt-footer a {
                color: var(--accent);
                text-decoration: none;
            }

            /* Remember-me saved indicator */
            .staticrypt-saved-password {
                display: none;
                text-align: center;
                margin-bottom: 16px;
                font-size: 0.8em;
                color: var(--text-secondary);
            }
        </style>

        <script>
            // Detect theme from localStorage (set by main site), apply matching colors
            (function() {
                var theme = null;
                try { theme = localStorage.getItem('wiki-theme'); } catch(e) {}
                if (theme === 'terminal-dark') {
                    document.documentElement.setAttribute('data-wiki-theme', 'terminal-dark');
                }
                // default: TokyoNight (no attribute needed — CSS :root defaults)
            })();
        </script>
    </head>
    <body>
        <div class="staticrypt-page">
            <div class="staticrypt-form">
                <h1>🔒 /*[|template_title|]*/</h1>
                <p class="staticrypt-instructions">/*[|template_instructions|]*/</p>
                <div class="staticrypt-password-container">
                    <input
                        id="staticrypt-password"
                        type="password"
                        placeholder="Password"
                        autofocus
                        onkeydown="if(event.key==='Enter') decrypt()"
                    />
                    <img
                        id="staticrypt-password-toggle-icon"
                        class="staticrypt-toggle-password-visibility"
                        title="/*[|template_toggle_show|]*/"
                        src='data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="%23c0caf5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>'
                        onclick="togglePasswordVisibility()"
                    />
                </div>
                <button
                    class="staticrypt-decrypt-button"
                    onclick="decrypt()"
                >/*[|template_button|]*/</button>
                <div id="staticrypt-error" class="staticrypt-error"></div>
                /*[|template_remember|]*/
            </div>
            <div class="staticrypt-footer">
                落星部落 · <a href="https://lothing.github.io">lothing.github.io</a>
            </div>
        </div>
    </body>
</html>
